# Baut die Add-on-Images fuer aarch64 + amd64 und legt sie in der GitHub-Container-Registry ab
# (ghcr.io/estol-de/{arch}-addon-xmoment-connect:<version>). Bei Pull-Requests nur Testbau ohne Upload.
# 15.11.2026: Standard-Docker-Actions statt home-assistant/builder (abgekuendigt, Builder-Image nicht mehr abrufbar).
name: Build

on:
  push:
    branches: [main]
    paths: ["xmoment_connect/**", ".github/workflows/build.yaml"]
  pull_request:
    paths: ["xmoment_connect/**"]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./xmoment_connect"

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - name: Version und Basis-Image lesen
        id: info
        run: |
          echo "version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' xmoment_connect/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "base=$(sed -n 's/^ *${{ matrix.arch }}: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' xmoment_connect/build.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: ./xmoment_connect
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=${{ steps.info.outputs.base }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-xmoment-connect:${{ steps.info.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-xmoment-connect:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.info.outputs.version }}
            io.hass.name=estol XMoment Connect
            org.opencontainers.image.title=estol XMoment Connect
            org.opencontainers.image.vendor=estol
            org.opencontainers.image.source=https://github.com/estol-de/xmoment-ha-addons
