name: "estol XMoment Connect"
version: "1.0.0"
slug: "xmoment_connect"
description: "Bindet XMoment-Geräte mit einem Klick an Home Assistant an – Casambi-Leuchten und Szenen erscheinen automatisch."
url: "https://github.com/estol-de/xmoment-ha-addons/tree/main/xmoment_connect"
arch:
  - aarch64
  - amd64
image: "ghcr.io/estol-de/{arch}-addon-xmoment-connect"
init: false
# Heimnetz sehen: XMoment-Geräte melden sich per mDNS (_xmoment._tcp)
host_network: true
# Zugang zum Mosquitto-Broker, den das Add-on an die Geräte weitergibt
services:
  - "mqtt:need"
ingress: true
panel_icon: "mdi:lightbulb-group"
panel_title: "XMoment"
options:
  auto_connect: true
  devices: []
  log_level: "info"
schema:
  auto_connect: "bool"
  devices:
    - "str"
  log_level: "list(debug|info|warning|error)"
